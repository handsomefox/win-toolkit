name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to rebuild and publish; leave empty for a dry run
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    permissions:
      contents: read
    uses: handsomefox/app-workflows/.github/workflows/ci.yml@e8adf543b3aac52e25b3350e69ab08f8b234d7fc # v0.1.0
    with:
      ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

  release:
    name: Release
    needs: checks
    permissions:
      attestations: write # Publish provenance for each release asset.
      contents: write # Create the GitHub release and upload assets.
      id-token: write # Request the OIDC identity used for provenance.
    uses: handsomefox/app-workflows/.github/workflows/release.yml@e8adf543b3aac52e25b3350e69ab08f8b234d7fc # v0.1.0
    with:
      package: toolkit-app
      bin: win-toolkit
      release-tag: ${{ inputs.release_tag }}
