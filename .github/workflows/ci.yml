name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a new RustSec advisory fails the audit without waiting for a push.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: handsomefox/app-workflows/.github/workflows/ci.yml@e8adf543b3aac52e25b3350e69ab08f8b234d7fc # v0.1.0
